# Configuración central del proyecto HAR-Video-Recognition
seed: 42
paths:
  archive: data/raw/UCF101_subset.tar
  extracted_root: data/processed/UCF101_subset
  results: results
  checkpoints: checkpoints
classes:
  - ApplyLipstick
  - Archery
  - BabyCrawling
  - BalanceBeam
  - BandMarching
  - BaseballPitch
  - Basketball
  - BasketballDunk
  - BenchPress
video:
  num_frames: 16
  image_size: 112
  mean: [0.43216, 0.394666, 0.37645]
  std: [0.22803, 0.22145, 0.216989]
  train_temporal_augmentation: true
  horizontal_flip_prob: 0.5
  brightness_jitter: 0.15
  contrast_jitter: 0.15
training:
  batch_size: 4
  num_workers: 2
  pin_memory: true
  epochs: 25
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 5
evaluation:
  metrics_dir: results/metrics
  figures_dir: results/figures
